<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>財務諸表講座｜サロンカレッジ経営本科 プロオンクラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy-3:#2a3c66;
  --gold:#b8955a; --gold-2:#d4b88a; --gold-soft:#f4ecdf;
  --bg:#f8f6f2; --card:#fff; --ink:#1e2430; --muted:#6b7280; --line:#e6e1d8; --accent:#c0396b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--navy-3),transparent),var(--navy)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:40px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .brand{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.login-card h1{font-family:"Zen Old Mincho",serif;font-size:22px;line-height:1.5;margin:10px 0 0;color:var(--navy)}
.login-card .rule{width:40px;height:1px;background:var(--gold);margin:22px auto}
.login-card input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;letter-spacing:.1em}
.login-card input:focus{outline:2px solid var(--gold-2);border-color:var(--gold)}
.login-card .btn{width:100%;margin-top:14px;padding:14px;border-radius:999px;background:var(--gold);color:#fff;font-weight:700}
.login-card .btn:hover{background:#a6844c}
.login-err{color:#b4443c;font-size:13px;margin-top:10px;min-height:1.5em}

/* Page */
header{background:var(--navy);color:#fff}
.hd{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.hd small{font-size:10px;letter-spacing:.25em;color:var(--gold-2)}
.logout{margin-left:auto;white-space:nowrap;font-size:12px;color:#cfd6e6;padding:6px 10px;border-radius:6px}
.logout:hover{background:rgba(255,255,255,.1)}
main{max-width:900px;margin:0 auto;padding:36px 16px 80px}
.ttl{text-align:center;margin-bottom:26px}
.ttl .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.ttl h1{font-family:"Zen Old Mincho",serif;font-size:30px;line-height:1.45;color:var(--navy);margin-top:6px}
.ttl .rule{width:48px;height:1px;background:var(--gold);margin:18px auto 0}

.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:0;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap}
.tab:hover{border-color:var(--gold)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.player{position:relative;aspect-ratio:16/9;background:#0b1224;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(20,33,61,.15)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#aab3c8;padding:20px}
.player .empty b{display:block;font-family:"Zen Old Mincho",serif;color:#fff;font-size:20px;margin-bottom:6px}

.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 30px 34px;margin-top:32px}
.box h2{font-family:"Zen Old Mincho",serif;font-size:21px;color:var(--navy);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.box h2:before{content:"";width:18px;height:1px;background:var(--gold)}
.q{margin-top:20px;padding-top:20px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:none;padding-top:6px}
.q .qt{display:flex;gap:12px;font-weight:700;line-height:1.8}
.q .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;margin-top:2px}
.fields{margin:14px 0 0 40px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.fields div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:6px 2px;font-size:14px}
.fields div span:first-child{font-weight:700}
.fields div.key span:first-child{color:var(--accent)}
.fields div span:last-child{color:var(--muted);white-space:nowrap}
.extra{margin:14px 0 0 40px;background:var(--gold-soft);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
.ref img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:14px}
footer{text-align:center;font-size:11px;color:var(--muted);padding:0 16px 40px;letter-spacing:.1em}
@media (max-width:640px){
  .ttl h1{font-size:23px}
  .box{padding:22px 18px 26px}
  .fields,.extra{margin-left:0}
  .fields{grid-template-columns:1fr}
  .tab{font-size:13px;padding:10px 6px}
}
</style>
</head>

  $("lgBrand").textContent = PAGE.brand;
  $("lgTitle").innerHTML = esc(PAGE.course) + "<br>" + esc(PAGE.title);

    e.preventDefault();
    if($("pw").value.trim() === PAGE.password){ auth = true; set(true); boot(); }
    else $("lgErr").textContent = "合言葉が違います。もう一度お試しください。";

  $("logout").addEventListener("click", () => { auth = false; set(false); boot(); });

    const v = PAGE.videos[cur] || {}, id = ytId(v.url);
    return id
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
      : `<div class="empty"><div><b>${esc(v.title||"")} 動画準備中</b>公開までしばらくお待ちください。</div></div>`;
  }

  function render(){
    $("hdBrand").textContent = PAGE.brand;
    $("foot").textContent = "© " + PAGE.brand;
    const tabs = PAGE.videos.length > 1
      ? `<div class="tabs">${PAGE.videos.map((v,i) => `<button class="tab ${i===cur?"on":""}" data-i="${i}">▶ ${esc(v.title)}</button>`).join("")}</div>` : "";
    const works = (PAGE.works||[]).map((w,i) => `
      <div class="q">
        <div class="qt"><span class="num">${i+1}</span><span>${esc(w.q)}</span></div>
        ${w.fields ? `<div class="fields">${w.fields.map(f => `<div class="${f[2]?"key":""}"><span>${esc(f[0])}</span><span>（　　　　　　${esc(f[1])}）</span></div>`).join("")}</div>` : ""}
        ${w.extra ? `<div class="extra">${esc(w.extra)}</div>` : ""}
      </div>`).join("");
    $("main").innerHTML = `
      <div class="ttl"><div class="eyebrow">${esc(PAGE.course)}</div><h1>${esc(PAGE.title)}</h1><div class="rule"></div></div>
      ${tabs}
      <div class="player" id="player">${playerHTML()}</div>
      ${works ? `<section class="box"><h2>財務諸表ワーク</h2>${works}</section>` : ""}
      ${PAGE.refImage ? `<section class="box ref"><h2>参考資料｜損益計算書の見方</h2><img src="${PAGE.refImage}" alt="損益計算書と利益の流れ"></section>` : ""}`;
    document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
      cur = +b.dataset.i;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", +t.dataset.i === cur));
      $("player").innerHTML = playerHTML();
    }));
  }
  function boot(){
    if(auth){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); render(); }
    else { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("pw").value=""; $("lgErr").textContent=""; }
  }
  boot();
})();
</script>
</body>
</html>
